name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          F=$(find . -maxdepth 4 -name settings.gradle -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle not found"; find . -maxdepth 3 -not -path './.git/*' | head -50; exit 1; fi
          D=$(dirname "$F")
          echo "Project folder: $D"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install fonts and prepare web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install
          node scripts/prepare-web.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sijil-ostaz-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
